# Install as /etc/systemd/system/rpanion-server.service.d/video-following.conf
# The service and video child must run as the same user that owns this directory.
[Service]
RuntimeDirectory=rpanion-video
RuntimeDirectoryMode=0755
Environment=RPANION_VIDEO_STATE_FILE=/run/rpanion-video/state.json
Environment=RPANION_WEBRTC_RTP_PORT=5601
